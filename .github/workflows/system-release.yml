name: System federation release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Fork version (0.1.6-system.N)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '2'

concurrency:
  group: system-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'gethamster/oss-openshell'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: oss-ubuntu24-x64
            platform: linux-amd64
            cli: x86_64-unknown-linux-musl
            gateway: x86_64-unknown-linux-gnu
          - runner: oss-ubuntu24-arm64
            platform: linux-arm64
            cli: aarch64-unknown-linux-musl
            gateway: aarch64-unknown-linux-gnu
          - runner: macos-15
            platform: macos
            cli: aarch64-apple-darwin
            gateway: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^0\.1\.6-system\.[1-9][0-9]*$ ]]'
      - uses: ./.github/actions/setup-nix
        with:
          prepare-shell: 'true'
      - uses: ./.github/actions/build-rust-binary
        with:
          package: openshell-cli
          binary: openshell
          triple: ${{ matrix.cli }}
          cargo-version: ${{ inputs.version }}
          supervisor-image-tag: '0.1.6'
      - uses: ./.github/actions/build-rust-binary
        with:
          package: openshell-gateway
          binary: openshell-gateway
          triple: ${{ matrix.gateway }}
          cargo-version: ${{ inputs.version }}
          supervisor-image-tag: '0.1.6'
      - name: Check issuer federation
        env:
          GATEWAY_TRIPLE: ${{ matrix.gateway }}
        run: |
          set -euo pipefail
          nix develop -c cargo test --release --target "$GATEWAY_TRIPLE" \
            -p openshell-server --lib auth::oidc::federation::tests | tee federation-tests.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' federation-tests.log
      - name: Check internal credential isolation
        env:
          GATEWAY_TRIPLE: ${{ matrix.gateway }}
        run: |
          set -euo pipefail
          for suite in credentials::tests ssh_identity::tests supervisor_pool::tests; do
            nix develop -c cargo test --release --target "$GATEWAY_TRIPLE" \
              -p openshell-server --lib "$suite" | tee credential-tests-current.log
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' credential-tests-current.log
            cat credential-tests-current.log >> credential-tests.log
          done
      - name: Package verified binaries
        env:
          VERSION: ${{ inputs.version }}
          CLI_TRIPLE: ${{ matrix.cli }}
          GATEWAY_TRIPLE: ${{ matrix.gateway }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p dist
          target/$CLI_TRIPLE/release/openshell --version | grep -F "$VERSION"
          target/$GATEWAY_TRIPLE/release/openshell-gateway --version | grep -F "$VERSION"
          tar -czf "dist/openshell-$CLI_TRIPLE.tar.gz" -C "target/$CLI_TRIPLE/release" openshell -C "$GITHUB_WORKSPACE" LICENSE LICENSE-UPSTREAM
          tar -czf "dist/openshell-gateway-$GATEWAY_TRIPLE.tar.gz" -C "target/$GATEWAY_TRIPLE/release" openshell-gateway -C "$GITHUB_WORKSPACE" LICENSE LICENSE-UPSTREAM
          git rev-parse HEAD > "dist/source-$PLATFORM.txt"
          cp federation-tests.log "dist/federation-tests-$PLATFORM.log"
          cp credential-tests.log "dist/credential-tests-$PLATFORM.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: system-release-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: oss-ubuntu24-x64
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: system-release-*
          merge-multiple: true
          path: dist
      - name: Verify provenance and publish the gateway image
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          for source in dist/source-*.txt; do test "$(cat "$source")" = "$GITHUB_SHA"; done
          for arch in amd64 arm64; do
            case "$arch" in amd64) triple=x86_64-unknown-linux-gnu ;; arm64) triple=aarch64-unknown-linux-gnu ;; esac
            mkdir -p "deploy/docker/.build/prebuilt-binaries/$arch"
            tar -xzf "dist/openshell-gateway-$triple.tar.gz" -C "deploy/docker/.build/prebuilt-binaries/$arch"
          done
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=true --sbom=true --push \
            -t "ghcr.io/gethamster/oss-openshell/gateway:$VERSION" -f deploy/docker/Dockerfile.gateway \
            --metadata-file dist/gateway-image.json .
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          printf 'OpenShell issuer-scoped federation for System.\n\nSource: %s\nUpstream base: 42671c2\n\nBuilt with the upstream Nix toolchain and auditable binary packaging. Each platform passed the federation contract tests.\n' "$GITHUB_SHA" > dist/release-notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --prerelease --title "OpenShell $VERSION" \
            --notes-file dist/release-notes.md dist/*.tar.gz dist/SHA256SUMS dist/source-*.txt dist/gateway-image.json

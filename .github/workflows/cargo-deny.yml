name: Cargo Deny (scheduled)

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_ref:
        description: Optional pre-release tag to scan instead of the triggering revision
        default: ""
        type: string
      advisories-only:
        description: Run only the dependency advisory check
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  packages: read

concurrency:
  group: cargo-deny-${{ github.workflow }}-${{ inputs.candidate_ref || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: Cargo Deny
    runs-on: oss-ubuntu24-x64
    container:
      image: us-central1-docker.pkg.dev/oss-foundry/oss-ci-builds/openshell-ci@sha256:fdea6e797426fc3d96999a29e4c1b108c48dbdf1cfe5507da0b5648c20d2d267
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_ref && format('refs/tags/{0}', inputs.candidate_ref) || '' }}

      - name: Install tools
        run: mise install --locked

      - name: Check dependencies
        if: ${{ !inputs.advisories-only }}
        run: mise run rust:deny

      - name: Check dependency advisories
        if: inputs.advisories-only
        run: cargo deny check advisories

name: GPU E2E Test

on:
  workflow_call:
    inputs:
      image-tag:
        description: Image tag to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  e2e-gpu:
    name: GPU E2E unavailable
    runs-on: oss-linux-small
    timeout-minutes: 5
    steps:
      - name: Report unavailable GPU coverage
        run: |
          echo '::error::GPU runners are not provisioned for OSS CI. Requested GPU coverage cannot run; CPU checks do not provide GPU verification.'
          exit 1

name: Build CI Image

on:
  push:
    branches: [main]
    paths:
      - 'deploy/docker/Dockerfile.ci'
      - 'mise.toml'
      - 'mise.lock'
      - 'tasks/**'
      - '.github/workflows/ci-image.yml'
  workflow_dispatch:

env:
  REGISTRY: us-central1-docker.pkg.dev
  CI_IMAGE: us-central1-docker.pkg.dev/oss-foundry/oss-ci-builds/openshell-ci

permissions:
  contents: read
  id-token: write

jobs:
  build-ci-image:
    name: Build (${{ matrix.arch }})
    if: github.repository == 'gethamster/oss-openshell' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: oss-ubuntu24-x64
          - arch: arm64
            platform: linux/arm64
            runner: oss-ubuntu24-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Isolate registry publication credentials
        run: |
          mkdir -p "$RUNNER_TEMP/ci-publish-docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/ci-publish-docker" >> "$GITHUB_ENV"

      - name: Authenticate CI image publication
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/1042503748934/locations/global/workloadIdentityPools/oss-ci-github/providers/github
          service_account: oss-ci-publisher@oss-foundry.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false

      - name: Log in to the CI registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Resolve BuildKit config
        id: buildkit
        run: |
          if [[ -r /etc/buildkit/buildkitd.toml ]]; then
            echo "config=/etc/buildkit/buildkitd.toml" >> "$GITHUB_OUTPUT"
          else
            echo "config=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx
        with:
          buildkitd-config: ${{ steps.buildkit.outputs.config }}

      - name: Build and push CI image
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH_IMAGE: ${{ env.CI_IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker buildx build \
            --builder openshell \
            --platform "${{ matrix.platform }}" \
            --secret id=MISE_GITHUB_TOKEN,env=MISE_GITHUB_TOKEN \
            --cache-from "type=registry,ref=${CI_IMAGE}:buildcache-${{ matrix.arch }}" \
            --cache-to "type=registry,mode=max,ref=${CI_IMAGE}:buildcache-${{ matrix.arch }}" \
            --push \
            -t "$ARCH_IMAGE" \
            -f deploy/docker/Dockerfile.ci \
            .

      - name: Smoke check CI image
        env:
          ARCH_IMAGE: ${{ env.CI_IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker run --rm --platform "${{ matrix.platform }}" "$ARCH_IMAGE" mise --version
          docker run --rm --platform "${{ matrix.platform }}" "$ARCH_IMAGE" gh --version
          docker run --rm --platform "${{ matrix.platform }}" "$ARCH_IMAGE" docker buildx version

  merge-ci-image:
    name: Merge manifest
    if: github.repository == 'gethamster/oss-openshell' && github.ref == 'refs/heads/main'
    needs: build-ci-image
    runs-on: oss-ubuntu24-x64
    timeout-minutes: 10
    steps:
      - name: Isolate registry publication credentials
        run: |
          mkdir -p "$RUNNER_TEMP/ci-publish-docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/ci-publish-docker" >> "$GITHUB_ENV"

      - name: Authenticate CI image publication
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/1042503748934/locations/global/workloadIdentityPools/oss-ci-github/providers/github
          service_account: oss-ci-publisher@oss-foundry.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false

      - name: Log in to the CI registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --prefer-index=false \
            -t "${CI_IMAGE}:${GITHUB_SHA}" \
            -t "${CI_IMAGE}:latest" \
            "${CI_IMAGE}:${GITHUB_SHA}-amd64" \
            "${CI_IMAGE}:${GITHUB_SHA}-arm64"

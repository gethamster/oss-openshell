[package]
name = "openshell-otel-test-support"
description = "Shared OTLP collector fixture for OpenShell tracing tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
openshell-otel = { path = "../openshell-otel" }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic", "logs", "trace"] }
prost = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true, features = ["gzip", "tls-aws-lc"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
openshell-crypto = { workspace = true }
rcgen = { workspace = true }
tempfile = "3"

[lints]
workspace = true

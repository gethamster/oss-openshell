[package]
name = "openshell-testkit-macros"
description = "The #[testkit::test] attribute for OpenShell end-to-end test suites"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license-file = "../../../LICENSE"
repository = "https://github.com/NVIDIA/OpenShell"
publish = false

[lib]
name = "testkit_macros"
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
